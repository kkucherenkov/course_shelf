name: Release (ghcr)

# The one and only release lane. Triggered by pushing a
# `vMAJOR.MINOR.PATCH-release` tag to github.com/kkucherenkov/course_shelf,
# it publishes:
#   - images → ghcr.io/kkucherenkov/courseshelf-{backend,web}
#     (four tags each: X.Y.Z, X.Y, X, latest)
#   - a GitHub Release with the deploy-ready artefact bundle (compose rendered
#     with REGISTRY / REGISTRY_NAMESPACE / RELEASE_TAG pinned)
#
# Between build and push, the backend image is smoke-tested: whisper-cli runs
# for real, inside that image, against a real ggml model — the 1.3.0 release
# shipped one that died with "Illegal instruction (core dumped)" on the
# target machine because every gate that ran it used WHISPER_MODE=mock. A
# failure there stops the job before anything is pushed or released.
#
# llama-completion (E29-F02-S01, quiz generation) gets no equivalent smoke
# test here — deliberate, not an oversight: there is no whisper-tiny-sized
# gguf to fetch per run (the smallest realistic weight is ~2.6 GB, against
# whisper-tiny's ~75 MB), and the maintainer was explicit that no workflow
# ever downloads a model weight. The `-march=native` class of bug is still
# structurally prevented (GGML_NATIVE=OFF, same as whisper's stage), and the
# Dockerfile's llama stage proves AVX2 actually landed via `objdump` on the
# built binary — no model, no run, no network fetch required for that check.
#
# A `workflow_dispatch` run is a dry run: it renders and validates the release
# compose against HEAD and stops there — no login, no image build, no smoke
# test, no release. It exists because the tag-only trigger meant this file was
# untestable without cutting a real release, which is exactly how a stale
# placeholder list survived for weeks (see the render+validate step below).
#
# No extra secrets are needed: GITHUB_TOKEN with `packages: write` covers both
# the ghcr push and the Release API.
#
# ⚠ The render step sed-rewrites the `${VAR:-default}` literals in
# docker/compose.release.yml verbatim. If a default changes there, the
# patterns below must change in the same commit or the sed silently no-ops.

on:
  push:
    tags:
      - "v*.*.*-release"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: kkucherenkov

jobs:
  release:
    name: Build, push to ghcr, and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for git-cliff

      # ─── Tag → semver ────────────────────────────────────────────────────
      - name: Parse release tag
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Dry run against HEAD — render + validate only, nothing is
            # tagged or published, so the version is a placeholder.
            TAG="dispatch"
            SEMVER="0.0.0-dispatch"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-release$'; then
              echo "tag '$TAG' does not match vMAJOR.MINOR.PATCH-release" >&2
              exit 1
            fi
            SEMVER="${TAG#v}"
            SEMVER="${SEMVER%-release}"
          fi
          MAJOR="${SEMVER%%.*}"
          MINOR="${SEMVER#*.}"; MINOR="${MINOR%%.*}"
          PATCH="${SEMVER##*.}"
          {
            echo "tag=$TAG"
            echo "semver=$SEMVER"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "patch=$PATCH"
          } >> "$GITHUB_OUTPUT"

      # ─── Toolchain ───────────────────────────────────────────────────────
      - uses: ./.github/actions/setup-cs

      - name: Spec validate
        run: pnpm spec:validate

      - name: Build design tokens
        # Tokens are gitignored — the web Dockerfile's `nuxt generate` step
        # needs the generated files in the build context via `COPY . .`.
        run: pnpm design:build

      # ─── Render + validate release compose ────────────────────────────────
      # Runs before a single image layer is built, and on every trigger
      # including workflow_dispatch. It used to run only inside the bundle
      # step *after* "Build and push release images" — so a broken compose
      # file surfaced only once both images were already built and pushed to
      # ghcr. The 1.1.0 release did exactly that: it failed here with
      # `DERIVED_PATH` missing, leaving a `1.1.0` tag in the registry with no
      # bundle and no GitHub release beside it.
      - name: Render and validate release compose
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          STAGE="courseshelf-release-v${SEMVER}"
          NS="$REGISTRY_NAMESPACE"
          mkdir -p "$STAGE"

          # Render compose with RELEASE_TAG / REGISTRY / REGISTRY_NAMESPACE
          # pinned to the public ghcr coordinates.
          sed \
            -e "s|\${RELEASE_TAG:-latest}|${SEMVER}|g" \
            -e "s|\${REGISTRY:-ghcr.io}|${REGISTRY}|g" \
            -e "s|\${REGISTRY_NAMESPACE:-kkucherenkov}|${NS}|g" \
            docker/compose.release.yml > "$STAGE/compose.yml"

          # Validate the rendered compose (dummy values — syntax + file
          # existence only).
          #
          # The placeholder set is DERIVED from the compose file rather than
          # listed by hand. A hand-written list silently goes stale the moment
          # someone adds a `${VAR:?...}`, and it did: `DERIVED_PATH` arrived
          # with transcription, nobody updated the list here, and the first
          # release after that change failed at this line — after the images
          # had already been built and pushed.
          #
          # Every `${NAME:?...}` in the file is a variable the operator must
          # supply, so every one of them gets a placeholder. Paths get an
          # existing directory because `docker compose config` resolves bind
          # mount sources; anything else can be a literal.
          ( cd "$STAGE"
            ENVS=()
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              case "$name" in
                *_PATH|*_DIR)    ENVS+=("$name=/tmp") ;;
                PUBLIC_BASE_URL) ENVS+=("$name=http://placeholder.local") ;;
                *)               ENVS+=("$name=placeholder") ;;
              esac
            done < <(grep -oE '\$\{[A-Z_][A-Z0-9_]*:\?' compose.yml \
                      | sed -E 's/^\$\{//; s/:\?$//' | sort -u)

            if [ "${#ENVS[@]}" -eq 0 ]; then
              echo "::error::No \${VAR:?} placeholders found in compose.yml — the" \
                   "detection regex no longer matches the file it validates."
              exit 1
            fi

            printf 'Placeholder for required variable: %s\n' "${ENVS[@]}"
            env "${ENVS[@]}" docker compose -f compose.yml config --quiet )

      # ─── Registry login ──────────────────────────────────────────────────
      - name: Log in to ghcr.io
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      # ─── Build images ────────────────────────────────────────────────────
      # Build only — pushed further down, after the whisper smoke test below
      # has had a chance to fail the job first.
      - name: Build release images
        if: github.event_name != 'workflow_dispatch'
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail

          NS="$REGISTRY_NAMESPACE"

          build() {
            local name="$1"
            local dockerfile="$2"
            local image="$REGISTRY/$NS/$name"

            echo "::group::build $name"
            docker build \
              --build-arg "APP_VERSION=$SEMVER" \
              --label "org.opencontainers.image.source=https://github.com/${NS}/course_shelf" \
              --label "org.opencontainers.image.version=$SEMVER" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -f "$dockerfile" \
              -t "$image:$SEMVER" \
              -t "$image:$MAJOR.$MINOR" \
              -t "$image:$MAJOR" \
              -t "$image:latest" \
              .
            echo "::endgroup::"
          }

          build courseshelf-backend apps/backend/Dockerfile
          build courseshelf-web     apps/web/Dockerfile

      # ─── Whisper smoke test ──────────────────────────────────────────────
      # Runs whisper-cli INSIDE the just-built backend image, not on the
      # runner — the 1.3.0 defect was a build that only failed on the
      # target CPU (implicit `-march=native`), so a runner-side check
      # would not have caught it. Backend unit tests run WHISPER_MODE=mock
      # (and LLAMA_MODE=mock) and even the e2e job's production-shaped image
      # sets the same, so this is the only place in the whole pipeline a
      # real whisper binary runs — llama-completion never gets a real run at
      # all in CI, see the top-of-file comment for why.
      #
      # Deliberately before "Push release images" below: a step with a
      # plain `if:` (no always()/failure()) implicitly requires success(),
      # so a failure here already skips the push and everything after it —
      # no extra guard needed.
      - name: Whisper smoke test
        if: github.event_name != 'workflow_dispatch'
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          # No `-e`: a failed `docker run` must fall through to the status
          # check below, not exit the script before it runs.
          set -uo pipefail

          IMAGE="$REGISTRY/$REGISTRY_NAMESPACE/courseshelf-backend:${SEMVER}"
          MODEL="$RUNNER_TEMP/ggml-tiny.bin"

          # Same source the maintainer-facing `pnpm whisper:model` script
          # uses (scripts/fetch-whisper-model.ts) — tiny model, ~75 MB, kept
          # out of the image and out of the repo, fetched once per run.
          curl -sSfL \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin" \
            -o "$MODEL"

          # ffmpeg generates the 1s silent wav inside the container — no
          # fixture binary in the repo. whisper-cli does the rest.
          OUTPUT=$(docker run --rm \
            -v "$MODEL:/tmp/ggml-tiny.bin:ro" \
            "$IMAGE" \
            sh -c 'ffmpeg -hide_banner -loglevel error -f lavfi \
                     -i anullsrc=r=16000:cl=mono -t 1 -y /tmp/silence.wav \
                   && whisper-cli -m /tmp/ggml-tiny.bin -f /tmp/silence.wav -nt' 2>&1)
          STATUS=$?

          echo "$OUTPUT"

          # A SIGILL kill (illegal instruction) shows up as a shell message
          # on some paths, not just a non-zero exit — check both.
          if [ "$STATUS" -ne 0 ] || printf '%s' "$OUTPUT" | grep -qi 'illegal instruction'; then
            echo "::error::whisper-cli failed inside the built backend image (exit=$STATUS)." \
                 "Likely a non-portable build (e.g. -march=native / GGML_NATIVE not OFF)." >&2
            exit 1
          fi

      # ─── Push images ─────────────────────────────────────────────────────
      - name: Push release images
        if: github.event_name != 'workflow_dispatch'
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail

          NS="$REGISTRY_NAMESPACE"

          push() {
            local name="$1"
            local image="$REGISTRY/$NS/$name"

            echo "::group::push $name"
            docker push "$image:$SEMVER"
            docker push "$image:$MAJOR.$MINOR"
            docker push "$image:$MAJOR"
            docker push "$image:latest"
            echo "::endgroup::"
          }

          push courseshelf-backend
          push courseshelf-web

      # ─── Changelog (git-cliff) ───────────────────────────────────────────
      - name: Install git-cliff
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="2.6.1"
          curl -sSfL \
            "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/git-cliff.tgz
          tar -xzf /tmp/git-cliff.tgz -C /tmp
          install -m 0755 "/tmp/git-cliff-${VERSION}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Generate release notes
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          git-cliff \
            --config cliff.toml \
            --current \
            --strip header \
            > release-notes.md
          cat release-notes.md

      # ─── Assemble release bundle ─────────────────────────────────────────
      # The compose file was already rendered and validated above, ahead of
      # the image build. This step only adds what depends on that build's
      # neighbours — the release notes above — or on nothing at all (the
      # static docs), then tars the result.
      - name: Assemble release bundle
        if: github.event_name != 'workflow_dispatch'
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          STAGE="courseshelf-release-v${SEMVER}"

          cp docker/nginx/prod.conf "$STAGE/nginx-prod.conf"
          cp .env.release.example "$STAGE/.env.example"
          cp release-notes.md "$STAGE/CHANGELOG.md"

          # The installer agent travels with the bundle: unpack, run `claude`
          # (or `codex`) in the directory, and the skills in .claude/ drive
          # the install against the compose.yml sitting next to them — which
          # is why the scripts resolve their stack directory by walking up
          # from themselves. deploy/agent/tests/ is deliberately left behind;
          # it mocks docker and is of no use to someone installing.
          cp deploy/agent/CLAUDE.md deploy/agent/AGENTS.md "$STAGE/"
          cp -R deploy/agent/.claude "$STAGE/.claude"
          cat > "$STAGE/README.md" <<EOF
          # CourseShelf $SEMVER — release bundle

          ## Option A — let the agent do it

          Run \`claude\` (or \`codex\`) in this directory and say what you
          want. It checks the host, asks for your courses folder and the URL
          you will use, generates the secrets, starts the stack and tells you
          how to create the first account. It asks before every command that
          changes anything.

          ## Option B — by hand

          1. Copy \`.env.example\` to \`.env\` and fill in the secrets.
          2. \`docker compose --env-file .env -f compose.yml pull\`
          3. \`docker compose --env-file .env -f compose.yml up -d\`
          4. Browse to http://<your-host>:\${PROXY_PORT:-8080}
          5. Register on the page it sends you to — while there are no
             users, every route redirects to the sign-up wizard, and the
             first account created becomes the administrator.

          See CHANGELOG.md for what changed in this release.
          EOF

          cp "$STAGE/compose.yml" "compose-release-v${SEMVER}.yml"

          tar czf "${STAGE}.tar.gz" "$STAGE"
          ls -la "${STAGE}.tar.gz" "compose-release-v${SEMVER}.yml"

      # ─── GitHub release ──────────────────────────────────────────────────
      - name: Create GitHub release with assets
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "CourseShelf $SEMVER" \
            --notes-file release-notes.md \
            "courseshelf-release-v${SEMVER}.tar.gz" \
            "compose-release-v${SEMVER}.yml" \
            ".env.release.example" \
            "release-notes.md"
