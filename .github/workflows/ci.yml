name: CI

# CI for github.com/kkucherenkov/course_shelf — the sole repo since the
# self-hosted Forgejo was dropped on 2026-07-14. This file is the only CI that
# runs.
#
# Runners are free for public repos, so everything gates here: the consolidated
# `checks` job, codegen drift with a full Flutter toolchain, the Flutter
# analyze/test/golden job, trufflehog, license check and the vulnerability scan.

on:
  push:
    branches: [main]
  merge_group:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node and Flutter versions live in .github/actions/setup-cs/action.yml — the
# `env:` block that used to hold them could not reach the four other workflow
# files that hardcoded the same numbers.

jobs:
  # ── Path filter (mobile vs. everything else) ───────────────────────────────
  # `flutter-integration` (not a required check) skips outright on a
  # non-mobile PR via a job-level `if:`. `flutter` IS a required status check
  # on main — a job that branch protection sees skipped counts as blocking,
  # not passing — so it always runs; its expensive steps carry the `if:`
  # instead (see that job). `packages/specs` and `pnpm-lock.yaml` count as
  # mobile-affecting because the Dart client is generated from the spec: a
  # contract change has to exercise the mobile checks even though it touches
  # no `.dart` file.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      installer: ${{ steps.filter.outputs.installer }}

    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/ui_flutter/**'
              - 'packages/api-client-dart/**'
              - 'packages/specs/**'
              - 'pnpm-lock.yaml'
            installer:
              - 'deploy/agent/**'

  # ── Release installer agent ───────────────────────────────────────────────
  # The shell the release bundle ships to self-hosters. No pnpm, no setup-cs:
  # the suite is plain bash with fake `docker`/`curl` on PATH, and keeping it
  # dependency-free is the point — it has to be runnable on the NAS it
  # installs onto, not only here.
  installer:
    name: Installer agent (shell)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Syntax-check every script
        run: |
          set -euo pipefail
          find deploy/agent -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run the suite
        run: bash deploy/agent/tests/run.sh

  # ── PR title is a Conventional Commit ─────────────────────────────────────
  # A squash merge takes the PR TITLE as the commit subject on main, and
  # `commitlint` only ever saw local commits through the husky commit-msg
  # hook. So a PR whose commits were all conventional could still land an
  # unconventional subject — #560 did, and `cliff.toml` drops what it cannot
  # parse, which would have left the largest change of that release out of
  # the notes entirely.
  #
  # The title is author-controlled text. It reaches the shell through `env:`,
  # never through `${{ }}` interpolation inside `run:`, which would let a
  # title containing shell metacharacters execute as code.
  pr-title:
    name: PR title (conventional commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-cs

      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint

  # ── Checks (consolidated lint · typecheck · test · specs · ui audit) ──────
  # One job sharing one pnpm install + one design:build + one prisma generate.
  checks:
    name: Checks (lint · typecheck · test · specs · ui audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-cs

      # The backend's ffprobe/ffmpeg integration suite skips itself when the
      # binaries are absent, so without this step it had never executed —
      # `docs/audit/2026-08-29-plan-vs-code.md` §4. apt rather than a
      # third-party setup action: it is one line, needs no version pin, and
      # adds no supply-chain surface to a job that exists to check exactly that.
      - name: Install ffmpeg (backend metadata + thumbnail suite)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # `turbo run lint|typecheck|test` re-executed every package on every
      # run, including the ones the diff never touched. Turbo already knows
      # which of those are unchanged; it just had nowhere to remember it
      # between runs. `.turbo/cache` is that memory, restored from the last
      # run on this branch and falling back to any recent run.
      #
      # `actions/cache` rather than a remote cache server: it needs no
      # account, no token and no third party, which is the same reason the
      # ffmpeg step above uses apt instead of a setup action.
      - name: Restore turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Prisma generate
        run: pnpm --filter @app/backend prisma:generate

      - name: Build design tokens
        run: pnpm design:build

      - name: Validate + bundle specs
        run: pnpm spec:validate && pnpm spec:bundle

      # Both go through turbo, which discovers every package with the script —
      # for the same reason the Test step below does. Naming backend + web by
      # hand silently skipped @app/ui, @app/specs, @app/api-client-ts and
      # @app/design-tokens: @app/ui's `vue-tsc` had never run in CI, and was in
      # fact failing (a spread-after-key in AppScanProgress.spec.ts overwrote
      # errorsLabel, so a committed snapshot asserted "2 errors" for a fixture
      # with errors: 5). An inverted filter cannot silently omit a package the
      # way a hand-written list can.
      - name: Lint (ESLint, every package)
        run: pnpm exec turbo run lint

      - name: Typecheck (every package)
        run: pnpm exec turbo run typecheck

      # Backend keeps `test:coverage` explicitly — its `test` script omits
      # coverage, and the text reporter is useful in the log (there are no
      # thresholds, so this is reporting, not a gate).
      #
      # Everything else goes through turbo, which discovers every package with
      # a `test` script. The previous version named packages one by one and so
      # never ran @app/ui's 852 tests — they were invisible for as long as they
      # existed, and were in fact broken until #140 bumped vite/nuxt. An
      # inverted filter cannot silently omit a package the way a hand-written
      # list can.
      - name: Test
        run: |
          pnpm --filter @app/backend run test:coverage
          pnpm exec turbo run test --filter='!@app/backend'

      - name: UI components audit
        run: pnpm --filter @app/ui audit:components

      # `--strict`: the inventory in specs/design/README.md must match the code.
      # It ran report-only for months and always passed, which taught readers to
      # skip it while 37 Vue and 17 Flutter components went undocumented — see
      # docs/audit/2026-08-29-plan-vs-code.md §5.
      - name: Design inventory audit
        run: pnpm design:audit --strict

      # Key parity across the locales each app ships (mobile: 4, web: 2). The
      # gate existed as a checkbox in the PR template and nowhere else, so
      # nothing ever failed on a locale that had drifted — see
      # docs/audit/2026-08-29-plan-vs-code.md §4. Apps carrying a single locale
      # (backend) are skipped by the script: there is nothing to compare.
      - name: i18n key parity
        run: pnpm check:i18n

      # Every Centrifugo namespace the AsyncAPI contract uses must be declared
      # in every Centrifugo config. `scans:user:{userId}` was a documented
      # channel whose namespace no config ever declared, so Centrifugo answered
      # 102 "unknown channel" to both the publish and the subscribe — in dev,
      # prod and release alike. Scan progress sat at 0% for months with nothing
      # red: the backend publishes fire-and-forget and the unit tests mock
      # Centrifugo, so only a real deployment could ever have shown it.
      - name: realtime namespace parity
        run: pnpm check:realtime

      # The Gantt encoded Stage (A/B), never progress, so all 121 rows read
      # `:active` while 118 stories had shipped. Progress now comes from each
      # card's `**Status:**`; this step fails if the committed chart drifts
      # from the cards again. Writes nothing.
      - name: Roadmap chart matches the cards
        run: python3 docs/roadmap/tools/generate.py --roadmap-only --check

      # stylelint ran nowhere before this — which is why ~195 violations
      # accumulated across 28 files, and why dangling `var()` refs (an
      # undefined token invalidates the whole declaration, so AuthLayout
      # rendered with no padding at all) survived unnoticed. Needs
      # `design:build` to have run first: token CSS is generated and gitignored.
      - name: Stylelint
        run: pnpm stylelint

      - name: Prettier check
        run: pnpm format:check

  # ── Codegen drift guard ────────────────────────────────────────────────────
  # GitHub-only: needs the full Flutter + Java toolchain (Dart client
  # generation), which the homelab runner deliberately avoids — the
  # committed generated clients make codegen unnecessary at check-time
  # there. Here it's a free second opinion that the committed clients
  # match the spec.
  codegen-drift:
    name: Codegen drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-cs
        with:
          flutter: "true"

      # `openapi-generator-cli` fetches its Java jar from Maven Central on
      # every run, and Sonatype answers 403 often enough to red a required
      # check on a PR that never touched a spec (seen on #189, docs-only):
      #
      #   Download 7.21.0 ...
      #   Download failed, because of: "Request failed with status code 403"
      #   Error: Unable to access jarfile .../openapi-generator-cli-7.21.0.jar
      #
      # Caching it needs `storageDir` in `packages/specs/openapitools.json`
      # first: the default is `<package>/versions` inside
      # `node_modules/.pnpm/@openapitools+openapi-generator-cli@<version>_<hash>/`,
      # a path whose hash moves with the lockfile and which
      # `pnpm install` recreates empty anyway — nothing stable to key a cache
      # on. `restore-keys` is deliberately absent: an older jar restored under
      # a new version's key is not a cache hit, it is the wrong generator
      # silently producing a drift failure.
      - name: Cache the openapi-generator jar
        uses: actions/cache@v5
        with:
          path: ~/.cache/openapi-generator-cli
          key: openapi-generator-${{ hashFiles('packages/specs/openapitools.json') }}

      - name: Regenerate clients
        run: pnpm spec:codegen

      - name: Fail if generated clients drifted from committed sources
        run: |
          git diff --exit-code -- packages/api-client-ts packages/api-client-dart \
            || (echo '::error::Generated clients are out of date. Run `pnpm spec:codegen` locally and commit the diff.' && exit 1)

  # ── Flutter (analyze · test · goldens) ─────────────────────────────────────
  # Nothing ran Flutter before this job existed: neither Flutter package has a
  # package.json, so `turbo run test` cannot see them, and the only gate was a
  # checkbox in the PR template. #138 merged 2977 lines of Flutter, 22 tests and
  # 2 goldens with no check exercising any of it.
  #
  # No Node/pnpm needed — tokens.g.dart is committed, so nothing has to run
  # `pnpm design:build` first.
  flutter:
    name: Flutter (analyze · test · goldens)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # Android resource XML is parsed only by `:app:parseDebugLocalResources`,
      # deep inside the emulator job — so a malformed file costs a full build to
      # discover (#466 died there after 27 minutes). XML forbids `--` anywhere
      # inside a comment and every Flutter flag opens with one, which makes a
      # pasted build command the easy way to break a resource file. Needs no
      # toolchain, so it runs before setup and fails in seconds.
      - name: mobile — Android resource XML is well-formed
        if: needs.changes.outputs.mobile == 'true'
        run: |
          python3 - <<'PY'
          import pathlib, sys, xml.dom.minidom

          bad = []
          files = sorted(pathlib.Path("apps/mobile/android").rglob("*.xml"))
          for f in files:
              try:
                  xml.dom.minidom.parse(str(f))
              except Exception as exc:
                  bad.append(f"{f}: {exc}")

          print(f"parsed {len(files)} XML resource files")
          if bad:
              print("::error::malformed Android resource XML")
              for line in bad:
                  print(f"  {line}")
              sys.exit(1)
          PY

      # This job is a required status check, so it must always run and
      # report success — a job GitHub sees `skipped` blocks a merge exactly
      # like a failure would. What can be skipped instead is the expense: on
      # a non-mobile PR this and every step below runs in seconds rather than
      # the ~4m18s the Flutter toolchain + analyze + test + goldens took on a
      # backend-only PR (#451).
      - uses: ./.github/actions/setup-cs
        if: needs.changes.outputs.mobile == 'true'
        with:
          node: "false"
          flutter: "true"

      # ui_flutter first: it is the dependency, and its goldens are where a
      # token/theme regression surfaces.
      - name: ui_flutter — analyze
        if: needs.changes.outputs.mobile == 'true'
        working-directory: packages/ui_flutter
        run: flutter pub get && flutter analyze

      - name: ui_flutter — test (incl. goldens)
        if: needs.changes.outputs.mobile == 'true'
        working-directory: packages/ui_flutter
        run: flutter test

      # lib/i18n/strings.g.dart is gitignored by design (see apps/mobile/slang.yaml),
      # so a fresh checkout does not have it and every `context.t` reference fails
      # to resolve — 449 analyzer errors. It must be generated before analyze.
      # Unlike freezed's output (auth_user.freezed.dart / .g.dart), which IS
      # committed, slang's is regenerated on demand.
      #
      # Codegen order is load-bearing: slang_build_runner SKIPS generation, so
      # build_runner never writes strings.g.dart — but it errors if the file is
      # already there. build_runner first, then slang.
      - name: mobile — codegen (drift, then slang i18n)
        if: needs.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: mobile — analyze
        if: needs.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: flutter analyze

      - name: mobile — test
        if: needs.changes.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: flutter test

      # golden_toolkit writes pixel diffs to test/**/failures/. A golden
      # failure you cannot see only tells you "pixels changed", which is not
      # enough to decide whether to accept or fix.
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: golden-failures
          path: |
            packages/ui_flutter/test/**/failures/**
            apps/mobile/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  # ── Flutter integration tests (Android emulator) ───────────────────────────
  # `apps/mobile/integration_test/` existed since E18 and had never executed
  # anywhere: there is no emulator on the maintainer's host, and `flutter test`
  # only picks up `test/`. Everything reached through a platform channel was
  # therefore unverified end to end — `video_player`'s ExoPlayer, drift's
  # bundled SQLite, `path_provider`, `flutter_secure_storage`'s Keystore, and
  # `disk_space_plus`, whose native side had literally never run (#280).
  #
  # A GitHub-hosted `ubuntu-latest` runner does expose `/dev/kvm`, so the
  # emulator is hardware-accelerated rather than the hour-long ARM-under-QEMU
  # crawl. The udev rule below is what makes the device group-writable for the
  # runner user; without it the emulator silently falls back to software and
  # this job times out.
  #
  # Deliberately a separate job from `flutter` above: booting an AVD costs
  # minutes, and the analyze/test/golden signal must not wait behind it.
  flutter-integration:
    name: Flutter (integration_test · Android emulator)
    needs: changes
    # Not a required status check, so an outright job skip on a non-mobile
    # PR is harmless — unlike `flutter` above, which cannot use this shape.
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Pinned, not "latest": a system-image bump changes the decoder, the
      # SQLite build and the Keystore implementation all at once, which is not
      # something a green build should be able to do to itself overnight.
      API_LEVEL: "34"
      ARCH: x86_64
      TARGET: google_apis
      PROFILE: pixel_6

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-cs
        with:
          node: "false"
          flutter: "true"

      # The Gradle build behind `flutter test integration_test` needs a JDK.
      # The image's default has moved before; pinning 17 keeps AGP happy and
      # makes the failure mode a version mismatch here rather than an opaque
      # Gradle stack trace.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same ordering as the `flutter` job, and load-bearing for the same
      # reason: slang_build_runner skips generation, so build_runner never
      # writes strings.g.dart — but errors if it is already there.
      - name: mobile — codegen (drift, then slang i18n)
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      # Creating the AVD and letting it write a cold-boot snapshot is ~2 of the
      # job's minutes, and the result is byte-identical for a fixed
      # api-level/arch/target — exactly what a cache key is for.
      - name: Cache the AVD + its cold-boot snapshot
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.ARCH }}-${{ env.TARGET }}

      # The emulator-runner docs are explicit that the two invocations must
      # agree on every AVD-shaping input, or the second one rebuilds the image
      # the first just cached. Keep these blocks in sync.
      - name: Create the AVD and snapshot it
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: false
          script: echo "AVD created; snapshot written."

      - name: mobile — integration_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.ARCH }}
          target: ${{ env.TARGET }}
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Frame-timing-sensitive assertions do not survive window animations.
          disable-animations: true
          # `flutter test integration_test` builds one debug APK per file and
          # drives it on the booted AVD. `working-directory` is not an input of
          # this action, hence the `cd`.
          script: cd apps/mobile && flutter test integration_test

      # An emulator failure is usually only legible from logcat — the Dart-side
      # message is often just "the app crashed".
      - name: Upload the emulator log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-logcat
          path: |
            ~/.android/avd/**/*.log
            apps/mobile/build/**/reports/**
          if-no-files-found: ignore
          retention-days: 7

  # ── Security (secrets + licenses + vulnerabilities) ────────────────────────
  security:
    name: Security (secret scan · license audit · vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-cs

      - name: Secret scanning
        # Pinned release tag (not @main) — supply-chain hygiene for an
        # action that reads the full git history.
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          # On PR: diff PR base → HEAD. On push: diff previous commit → HEAD.
          # Avoid BASE==HEAD which trufflehog rejects with exit 1.
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

      # Allowlist includes a defensive MPL-2.0 entry for @axe-core/playwright.
      - name: License compliance check
        run: pnpm dlx license-checker --excludePrivatePackages --onlyAllow 'MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0;CC-BY-3.0;CC-BY-4.0;MPL-2.0'

      # Replaces `pnpm audit`, which is permanently broken: npm retired the
      # legacy audit endpoints (410 since 2026-07-15) and pnpm still calls
      # them — reproduced on pnpm 10.33.0, 10.34.5 and 11.13.0, so no upgrade
      # fixes it. See https://github.com/pnpm/pnpm/issues/11265.
      #
      # osv-scanner reads pnpm-lock.yaml directly and queries osv.dev, so it
      # depends on no npm endpoint. Pinned tag, same supply-chain hygiene as
      # trufflehog above.
      #
      # It exits 1 on ANY finding and has no severity threshold flag, so the
      # gate is applied below: fail on CRITICAL or HIGH. That raises the old
      # `--audit-level=critical` bar — the tree is clean at both levels as of
      # #140, which cleared CVE-2024-21534 plus 35 high-severity advisories.
      # MODERATE/LOW are reported in the log but do not fail the build.
      - name: Dependency vulnerability scan (critical + high)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src:ro" \
            ghcr.io/google/osv-scanner:v2.3.8 \
            scan source --lockfile=/src/pnpm-lock.yaml --format=json > osv.json || true

          if [ ! -s osv.json ]; then
            echo '::error::osv-scanner produced no output — treating as a scan failure rather than a pass.'
            exit 1
          fi

          jq -r '
            [ .results[]?.packages[]?
              | .package as $p
              | .vulnerabilities[]?
              | select((.database_specific.severity // "") as $s
                       | $s == "CRITICAL" or $s == "HIGH")
              | "\(.database_specific.severity)\t\($p.name)@\($p.version)\t\(.id)"
            ] | unique | .[]
          ' osv.json > gated.txt

          echo "Advisories by severity:"
          jq -r '[.results[]?.packages[]?.vulnerabilities[]?.database_specific.severity // "UNKNOWN"]
                 | group_by(.) | map("  \(.[0]): \(length)") | .[]' osv.json

          if [ -s gated.txt ]; then
            echo '::error::Critical or high-severity advisories found:'
            cat gated.txt
            exit 1
          fi
          echo 'No critical or high-severity advisories.'
