# Schemathesis configuration for `pnpm spec:contract-test`.
#
# Mounted into the container at /schemathesis.toml by scripts/contract-test.ts.
# Everything else — target URL, example budget, the bearer header — is still
# passed on the command line, because it is environment-dependent and this file
# is committed.

# The API rejects U+0000 anywhere in a request with 400 `null-byte-in-payload`
# (see `components.responses.BadRequest` in openapi.yaml): PostgreSQL cannot
# store the byte in a `text` column. That is a real constraint, but JSON Schema
# can only express it as a `pattern` repeated on every string in the document,
# so it lives as one check at the trust boundary instead — and Schemathesis,
# reading only the schema, generated NUL-bearing strings as *positive* cases and
# reported the correct 400 as "API rejected schema-compliant request".
#
# `allow-x00` is the knob for exactly this. It narrows what the generator emits;
# it does not weaken what is checked. Every check still runs at full strength on
# every operation, and the guard is still there — this only stops the fuzzer
# spending its budget on the one byte the transport cannot carry. Turning off
# `positive_data_acceptance`, or widening its expected statuses to include 400,
# would have hidden real findings; this hides none.
[generation]
allow-x00 = false

# POST /api/v1/realtime/token is the one operation in openapi.yaml that declares
# TWO alternative security schemes (`cookieAuth` OR `bearerAuth`); every other
# protected operation declares `bearerAuth` alone.
#
# The contract run supplies a bearer token on every request (it has to — see
# #321), so when Schemathesis drops or corrupts the *cookie* to check that the
# API rejects it, the bearer is still there and the API correctly answers 200.
# Both `ignored_auth` and `negative_data_rejection` then report a finding that
# describes our test setup, not the API: the spec says either credential is
# sufficient, and it is.
#
# Nothing real is lost. This operation takes no path parameters, no query
# parameters and no request body, so authentication is the only thing
# `negative_data_rejection` had to negate here.
#
# If a future operation gains a second security scheme, it belongs in this
# block too — and if the fix is instead to stop injecting a static credential
# (Schemathesis can log in dynamically via `[auth.dynamic]`), this whole block
# goes away.
[[operations]]
include-name = "POST /api/v1/realtime/token"
checks.ignored_auth.enabled = false
checks.negative_data_rejection.enabled = false

# POST /api/v1/libraries/{id}/transcriptions answers 503
# `transcription-not-configured` when WHISPER_MODEL_PATH is unset. That status
# is documented on the operation and the API conforms to its own spec here —
# this is not a crash and not drift.
#
# The CI stack ships no whisper model (a ggml file is ~75 MB and nothing in a
# contract run would transcribe anything), so the endpoint takes that branch on
# every request. `not_a_server_error` flags any 5xx and cannot tell a documented
# 503 from a real one, so it is off for this operation only; every other check
# stays armed on it.
#
# Known cost, taken deliberately: a genuine 500 on this path would now go
# unreported here.
#
# Open question, tracked as `tuxedo` 28: whether 503 is the right status at all.
# It means *temporarily* unable and invites retry, but "no model configured" is
# permanent until an operator edits env, so a client honouring `Retry-After`
# retries forever. If that is reclassified to a 4xx, delete this block.
[[operations]]
include-name = "POST /api/v1/libraries/{id}/transcriptions"
checks.not_a_server_error.enabled = false
# Seeded library id — see the "Seeded path parameters" section below. It lives
# in this block rather than one of its own because two `[[operations]]` blocks
# matching the same operation have no defined merge order.
parameters = { "path.id" = "seed-library-main" }

# ---------------------------------------------------------------------------
# Seeded path parameters
# ---------------------------------------------------------------------------
#
# 40 of the 75 operations take a path parameter, and every one of them is
# `type: string` in the schema. Schemathesis generates those from the schema —
# it invents a string — so no row in Postgres can ever match one. The result:
# those operations answered 404 (or 403, where the handler hides existence) on
# every request, the fuzzer never reached a handler, and their 200 responses
# were never compared against their schemas. Schemathesis names this exact
# condition in its own output: the `missing_test_data` warning, "API returns
# mostly 404 responses, suggesting test data doesn't match existing resources".
#
# Seeding the database alone does NOT fix that — the generated id still misses
# the seeded row. There are three mechanisms that can make a generated request
# address a real resource, and only one of them fits here:
#
#   * OpenAPI `links` — the Stateful phase chains a create response into a
#     later request's path parameter. The right answer for anything creatable
#     over the API, and it needs no seed. It does not reach the catalog: a
#     course, section, lesson, instructor, studio or tag is created by a
#     filesystem scan, not by an HTTP POST, so there is no create response to
#     chain from. openapi.yaml declares no `links` today; adding them is worth
#     doing for the runtime-created resources (identify tasks, transcriptions,
#     bookmarks, grants) and is tracked separately.
#
#   * `example` on the parameter in openapi.yaml — read by the Examples phase.
#     Rejected: it would put fixture ids in the published contract, where every
#     generated client and every reader of the docs would see them.
#
#   * parameter overrides here — test-only, invisible to the contract, applied
#     in every phase. This is what the blocks below use.
#
# The values come from `apps/backend/src/seed-catalog.ts` (`SEED_IDS` /
# `SEED_SLUGS`) and must change in both places together; the seed's ids are
# deliberately fixed constants rather than cuids for exactly this reason.
#
# NOT overridden, deliberately:
#
#   * `/stream/**` and `/admin/backups/{id}/download` — gated on a short-lived
#     HMAC token minted at request time, which the run cannot forge. A seeded
#     id changes nothing; these stay on the 401 path.
#   * `/admin/identify-tasks/{id}`, `/transcriptions/{id}/cancel`,
#     `/bookmarks/{id}`, `/access/grants/{id}` — the row is created at runtime
#     and owned by the principal, so its id cannot be a constant. These need
#     OpenAPI `links`, not a seed.
#   * `GET`/`PATCH /admin/users/{id}` — the only user is the principal, whose id
#     is minted at sign-up. It could be threaded in through this file's
#     `${VAR}` substitution, but `PATCH` would then fuzz the run's own admin
#     account — role, ban flag and all — and take the rest of the run with it.
#     Reaching this one needs a second, disposable user.
#   * `POST /admin/courses/{id}/scrape-preview` and `.../identify` — the
#     Stateful phase already reaches both by chaining a course id out of an
#     earlier response, and their outcome depends on what the scraper returns,
#     which is not something a path parameter fixes. (`compose.ci.yml` now sets
#     `SCRAPERS_MODE=mock` so that chain stops fetching generated URLs off the
#     public internet.)

[[operations]]
include-name = "GET /api/v1/courses/{id}"
parameters = { "path.id" = "seed-course-fundamentals" }

# `positive_data_acceptance` treats any non-2xx answer to schema-valid data as a
# finding, and a *documented* 422 is still a rejection to it. Two invariants on
# this payload cannot be pushed into the schema, so 422 is added to the expected
# set rather than the check being turned off:
#
#   - `ratingAverage: 0, ratingCount: null`. `dependentRequired` already forces
#     the pair to be present together, but the fields are nullable and the
#     handler reads an explicit `null` as "not supplied", so a present-but-null
#     count breaks the pair. JSON Schema has no way to say "both null or both
#     non-null" without an `if`/`then` pair that fights `additionalProperties`.
#     Whether `null` should instead mean "leave unchanged" here — as it already
#     does for the relation arrays on this same payload — is a real API question,
#     filed separately.
#   - `language`, which is validated as a BCP-47 tag by ICU at runtime.
#
# Known cost: a genuine over-rejection on this operation would now be reported
# only if it used a status other than 422.
[[operations]]
include-name = "PATCH /api/v1/courses/{id}"
parameters = { "path.id" = "seed-course-fundamentals" }
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

# Same treatment, different reason: the 422 here is raised by the scraped
# fragment stored on the task, not by anything in the request, so there is no
# request schema that could have prevented it. The Stateful phase reaches this
# operation now that a seeded course id lets it create an identify task first.
[[operations]]
include-name = "POST /api/v1/admin/identify-tasks/{id}/apply"
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

[[operations]]
include-name = "GET /api/v1/courses/{id}/outline"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
include-name = "GET /api/v1/courses/{id}/download-estimate"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
include-name = "POST /api/v1/courses/{id}/mark-complete"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
