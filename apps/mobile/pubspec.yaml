name: app_mobile
description: "Local first coursera"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^9.2.1
  intl: any
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  slang: ^4.1.0
  slang_flutter: ^4.1.0
  uuid: ^4.5.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  sentry_flutter: ^8.14.0
  app_ui:
    path: ../../packages/ui_flutter
  app_api_client:
    path: ../../packages/api-client-dart
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  # The app's first and only playback engine (E18-F02-S01). Wraps ExoPlayer on
  # Android and AVPlayer on iOS — the same delegate-to-the-platform stance as
  # web's raw `<video>` element (`apps/web/app/composables/useLessonPlayer.ts`),
  # so both clients accept the same formats and neither gets ahead of the
  # other's real capability. Reached only through
  # `features/player/domain/video_playback_port.dart`; it has no decoder under
  # `flutter test`, so the port is what keeps PlayerBloc testable.
  video_player: ^2.9.2
  # Dev-only Widgetbook catalog (widgetbook/main.dart). Declared as a regular
  # dependency because the catalog code lives under lib/ (forced by
  # always_use_package_imports + package-import testability); it is unreachable
  # from lib/main.dart, so AOT tree-shaking strips it from the release binary.
  widgetbook: ^3.14.3
  # AES-GCM for downloads-at-rest (E19-F01-S01). Pure Dart, so the block
  # writer/reader are testable under `flutter test` with no platform channel.
  cryptography: ^2.9.0
  # Opportunistic background resume. Android registers a worker, iOS a
  # BGAppRefreshTask; both only ever ask the queue to "resume what's
  # unfinished". Neither carries a whole transfer — see the E19-F01-S01 design.
  workmanager: ^0.9.0+3
  # Lets the queue distinguish "offline" (stay queued, no attempt burned) from
  # "failed" (count an attempt, back off).
  connectivity_plus: ^7.3.1

  # Device capacity + free space for the Downloads tab's storage bar. Dart has
  # no free-space API and `dart:io` exposes none, so this needs a platform
  # call. Values come back as MB (undocumented on pub.dev — confirmed from the
  # package's own example, which labels them "(MB)"); the conversion to bytes
  # lives in exactly one place, DiskSpaceDeviceStorage.
  disk_space_plus: ^0.2.6
  async: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test suites live under integration_test/ (E18-F02-S01 player,
  # E18-F03-S01 auth flows). They need a device/emulator to execute.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  slang_build_runner: ^4.1.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  built_collection: ">=5.1.1 <6.0.0"
  source_gen: ">=4.0.0 <5.0.0"
  drift_dev: ^2.34.0
  # Builds a raw pre-migration (v1) sqlite fixture in
  # app_database_migration_test.dart — drift's own onCreate always creates
  # the *current* schema, so a real v1 file has to be hand-built.
  sqlite3: ^3.5.0
  # Faked in downloads_wiring_test.dart: resolving the real DownloadsRepository
  # opens a real AppDatabase, which asks path_provider for a directory the
  # instant it is constructed — no query has to run first.
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
