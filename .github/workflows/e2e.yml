name: E2E smoke

# E2E smoke on GitHub-hosted runners:
#   - Steps run directly on the ubuntu-latest VM, so `localhost` reaches the
#     compose-published ports — no docker-bridge-gateway detection needed
#     (compose.ci.yml's E2E_HOST defaults to localhost).
#   - Playwright runs INSIDE mcr.microsoft.com/playwright:v1.59.1-jammy via
#     `docker run --network=host`. The committed visual baselines under
#     tests/e2e/*-snapshots/ were captured in exactly that image; running
#     Chromium on the 24.04 runner host instead would drift glyph metrics
#     and flake the visual spec. Image tag must match the playwright
#     version in package.json.
#   - This workflow never writes baselines. To refresh them, run the
#     `Regenerate visual snapshots` workflow (suite: `e2e`) — it brings up
#     this same production-shaped stack in the same image, reruns the suite
#     with `--update-snapshots`, and commits the result back to the branch.

# Runs on PRs — see quality.yml for the reasoning. The nightly cadence was a
# Forgejo-era constraint (paid, shared self-hosted runner) that died with the
# migration; this repo is public and the job takes ~6 minutes. A nightly
# failure has no PR and no author attached to it, which is precisely why the
# IBM Plex reflow (7eb328d) went unexplained for two days.
on:
  # `push: main` as well as `pull_request`: a squash-merge produces a commit
  # that no PR run ever tested — the merged tree differs from every head the
  # PR built. Without this, main could sit broken with every check green.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Kept: catches drift that isn't ours (base image, upstream deps).
    - cron: "0 3 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Playwright smoke (web + backend health)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-cs

      - name: Prisma generate
        run: pnpm --filter @app/backend prisma:generate

      - name: Build design tokens
        # Tokens are gitignored — apps/web's docker build (`nuxt generate`)
        # fails to resolve tokens.generated.css without them in the build
        # context.
        run: pnpm design:build

      - name: Pull external images
        run: docker compose -f docker/compose.yml -f docker/compose.ci.yml pull --quiet otel-lgtm

      # Production-shaped stack: compose.ci.yml overrides the dev bind-mount
      # services with real image builds (see that file's header for the full
      # rationale). Explicit service list skips `proxy` and `storybook`.
      - name: Bring up docker stack
        run: |
          docker compose -f docker/compose.yml -f docker/compose.ci.yml \
            up -d --build --wait --wait-timeout 600 \
            postgres centrifugo otel-lgtm backend web

      - name: Verify backend health
        run: curl -fsS http://localhost:3000/api/v1/health

      - name: Verify web
        run: curl -fsS http://localhost:3001/ > /dev/null

      # Credentials for the Schemathesis step further down. This has to run
      # HERE, before anything else can touch the database: the stack comes up
      # with an empty schema and `databaseHooks.user.create.before` in
      # apps/backend/src/common/auth/auth.service.ts promotes the FIRST account
      # to ADMIN. Sign up second and the contract test gets a plain USER, which
      # still answers 403 on every /admin operation.
      #
      # Playwright is unaffected: every page-driven spec stubs the API through
      # `page.route`, so an extra row in the users table is invisible to it.
      - name: Mint an admin bearer token for the contract test
        run: |
          set -euo pipefail
          password="contract-$(openssl rand -hex 16)"
          headers=$(curl -fsS -D - -o /dev/null \
            -X POST http://localhost:3000/api/v1/auth/sign-up/email \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"contract-test@example.invalid\",\"password\":\"${password}\",\"name\":\"Contract Test\"}")
          # Better Auth's `bearer()` plugin returns the session token in this
          # response header (the cookie is the browser's channel; the header is
          # the mobile/API one, and the spec's `bearerAuth` scheme describes it).
          token=$(printf '%s' "$headers" | tr -d '\r' | sed -n 's/^[Ss]et-[Aa]uth-[Tt]oken: *//p')
          if [ -z "$token" ]; then
            echo "::error::Sign-up returned no set-auth-token header — the contract test would silently fall back to the unauthenticated surface, which is exactly the blind spot #321 closed."
            exit 1
          fi
          echo "::add-mask::$token"

          # Prove the token is not just present but ADMIN-shaped before four
          # thousand generated requests depend on it.
          role=$(curl -fsS http://localhost:3000/api/v1/auth/get-session \
            -H "Authorization: Bearer ${token}" | tr ',' '\n' | sed -n 's/.*"role":"\([^"]*\)".*/\1/p' | head -1)
          echo "contract-test principal role: ${role:-<none>}"
          if [ "${role}" != "ADMIN" ]; then
            echo "::error::The contract-test account is '${role:-<none>}', not ADMIN — every /admin operation would answer 403 and go unchecked. Something created a user before this step."
            exit 1
          fi

          echo "CONTRACT_TEST_BEARER_TOKEN=$token" >> "$GITHUB_ENV"

      # --network=host lets the container's localhost reach the published
      # ports; --ipc=host is Chromium's shared-memory recommendation. The
      # repo mounts read-write because Playwright writes its report and
      # traces into tests/e2e/.
      - name: Run Playwright smoke (inside the baseline-capture image)
        run: |
          docker run --rm --ipc=host --network=host \
            -v "$PWD:/work" -w /work \
            -e CI=1 \
            -e E2E_WEB_URL=http://localhost:3001 \
            -e E2E_BACKEND_URL=http://localhost:3000 \
            -e E2E_EXPECT_CSP=1 \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.59.1-jammy \
            ./node_modules/.bin/playwright test --config=tests/e2e/playwright.config.ts

      # Schemathesis against the running backend. `pnpm spec:contract-test` has
      # existed since E02-F02-S04 and ran in no workflow, so the one gate that
      # checks the implementation against the spec at runtime (rather than the
      # spec against itself, as `spec:validate` does) had never fired once.
      # This workflow is its only possible home: it is the only one that boots
      # a backend.
      #
      # AFTER Playwright, deliberately: schemathesis is property-based and
      # sends generated POST/PATCH/DELETE traffic, so running it first would
      # leave fuzz data in the database that the visual specs then screenshot.
      # It still reports as itself when it fails.
      #
      # The script's default base URL is `host.docker.internal:3000` and it
      # passes `--add-host=…:host-gateway`, which resolves to the runner's
      # docker bridge gateway — that reaches the compose-published port on the
      # host, so no URL override is needed here.
      #
      # CONTRACT_TEST_BEARER_TOKEN comes from the sign-up step above. Without
      # it 62 of the 75 operations answered 401 before a handler ran, so no
      # response body had ever been compared against its schema (#321).
      - name: Spec contract test (Schemathesis)
        # REQUIRE_AUTH turns a missing token into a failure instead of a
        # warning. The token reaching the script is a two-link chain (GITHUB_ENV
        # → turbo `passThroughEnv`) and the first CI run broke on the second
        # link while still reporting success.
        env:
          CONTRACT_TEST_REQUIRE_AUTH: "1"
        run: pnpm spec:contract-test

      - name: Container state after Playwright
        if: always()
        run: |
          docker compose -f docker/compose.yml -f docker/compose.ci.yml ps
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: |
          for svc in centrifugo postgres otel-lgtm backend web; do
            echo "===== $svc ====="
            docker compose -f docker/compose.yml -f docker/compose.ci.yml logs --tail=200 "$svc" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml -f docker/compose.ci.yml down -v
