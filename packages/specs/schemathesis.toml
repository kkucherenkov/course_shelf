# Schemathesis configuration for `pnpm spec:contract-test`.
#
# Mounted into the container at /schemathesis.toml by scripts/contract-test.ts.
# Everything else — target URL, example budget, the bearer header — is still
# passed on the command line, because it is environment-dependent and this file
# is committed.

# The API rejects U+0000 anywhere in a request with 400 `null-byte-in-payload`
# (see `components.responses.BadRequest` in openapi.yaml): PostgreSQL cannot
# store the byte in a `text` column. That is a real constraint, but JSON Schema
# can only express it as a `pattern` repeated on every string in the document,
# so it lives as one check at the trust boundary instead — and Schemathesis,
# reading only the schema, generated NUL-bearing strings as *positive* cases and
# reported the correct 400 as "API rejected schema-compliant request".
#
# `allow-x00` is the knob for exactly this. It narrows what the generator emits;
# it does not weaken what is checked. Every check still runs at full strength on
# every operation, and the guard is still there — this only stops the fuzzer
# spending its budget on the one byte the transport cannot carry. Turning off
# `positive_data_acceptance`, or widening its expected statuses to include 400,
# would have hidden real findings; this hides none.
[generation]
allow-x00 = false

# POST /api/v1/realtime/token is the one operation in openapi.yaml that declares
# TWO alternative security schemes (`cookieAuth` OR `bearerAuth`); every other
# protected operation declares `bearerAuth` alone.
#
# The contract run supplies a bearer token on every request (it has to — see
# #321), so when Schemathesis drops or corrupts the *cookie* to check that the
# API rejects it, the bearer is still there and the API correctly answers 200.
# Both `ignored_auth` and `negative_data_rejection` then report a finding that
# describes our test setup, not the API: the spec says either credential is
# sufficient, and it is.
#
# Nothing real is lost. This operation takes no path parameters, no query
# parameters and no request body, so authentication is the only thing
# `negative_data_rejection` had to negate here.
#
# If a future operation gains a second security scheme, it belongs in this
# block too — and if the fix is instead to stop injecting a static credential
# (Schemathesis can log in dynamically via `[auth.dynamic]`), this whole block
# goes away.
[[operations]]
include-name = "POST /api/v1/realtime/token"
checks.ignored_auth.enabled = false
checks.negative_data_rejection.enabled = false

# POST /api/v1/libraries/{id}/transcriptions used to answer 503
# `transcription-not-configured` on every CI request — the stack shipped no
# whisper model (a ggml file is ~75 MB and the seed's one lesson has no media
# on disk anyway, so nothing would ever transcribe it). `docker/compose.ci.yml`
# now sets WHISPER_MODE=mock, which swaps in MockWhisperAdapter: it writes a
# fixed SRT with no child process and no model file, so the endpoint takes the
# normal 202 + walk path instead. `not_a_server_error` is armed on this
# operation like every other one.
#
# Seeded library id, and the same `ensure_resource_availability` /
# `negative_data_rejection` exemptions the rest of the `/libraries/{id}`
# family carries — see that section below for the reasoning on both.
[[operations]]
include-name = "POST /api/v1/libraries/{id}/transcriptions"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

# ---------------------------------------------------------------------------
# Seeded path parameters
# ---------------------------------------------------------------------------
#
# 40 of the 75 operations take a path parameter, and every one of them is
# `type: string` in the schema. Schemathesis generates those from the schema —
# it invents a string — so no row in Postgres can ever match one. The result:
# those operations answered 404 (or 403, where the handler hides existence) on
# every request, the fuzzer never reached a handler, and their 200 responses
# were never compared against their schemas. Schemathesis names this exact
# condition in its own output: the `missing_test_data` warning, "API returns
# mostly 404 responses, suggesting test data doesn't match existing resources".
#
# Seeding the database alone does NOT fix that — the generated id still misses
# the seeded row. There are three mechanisms that can make a generated request
# address a real resource, and only one of them fits here:
#
#   * OpenAPI `links` — the Stateful phase chains a create response into a
#     later request's path parameter. The right answer for anything creatable
#     over the API, and it needs no seed. It does not reach the catalog: a
#     course, section, lesson, instructor, studio or tag is created by a
#     filesystem scan, not by an HTTP POST, so there is no create response to
#     chain from. openapi.yaml declares no `links` today; adding them is worth
#     doing for the runtime-created resources (identify tasks, transcriptions,
#     bookmarks, grants) and is tracked separately.
#
#   * `example` on the parameter in openapi.yaml — read by the Examples phase.
#     Rejected: it would put fixture ids in the published contract, where every
#     generated client and every reader of the docs would see them.
#
#   * parameter overrides here — test-only, invisible to the contract, applied
#     in every phase. This is what the blocks below use.
#
# The values come from `apps/backend/src/seed-catalog.ts` (`SEED_IDS` /
# `SEED_SLUGS`) and must change in both places together; the seed's ids are
# deliberately fixed constants rather than cuids for exactly this reason.
#
# NOT overridden, deliberately:
#
#   * `/stream/**` and `/admin/backups/{id}/download` — gated on a short-lived
#     HMAC token minted at request time, which the run cannot forge. A seeded
#     id changes nothing; these stay on the 401 path.
#   * `/admin/identify-tasks/{id}`, `/transcriptions/{id}/cancel`,
#     `/bookmarks/{id}`, `/access/grants/{id}` — the row is created at runtime
#     and owned by the principal, so its id cannot be a constant. These need
#     OpenAPI `links`, not a seed.
#   * `GET`/`PATCH /admin/users/{id}` — the only user is the principal, whose id
#     is minted at sign-up. It could be threaded in through this file's
#     `${VAR}` substitution, but `PATCH` would then fuzz the run's own admin
#     account — role, ban flag and all — and take the rest of the run with it.
#     Reaching this one needs a second, disposable user.
#   * `POST /admin/courses/{id}/scrape-preview` and `.../identify` — the
#     Stateful phase already reaches both by chaining a course id out of an
#     earlier response, and their outcome depends on what the scraper returns,
#     which is not something a path parameter fixes. (`compose.ci.yml` now sets
#     `SCRAPERS_MODE=mock` so that chain stops fetching generated URLs off the
#     public internet.)

[[operations]]
include-name = "GET /api/v1/courses/{id}"
parameters = { "path.id" = "seed-course-fundamentals" }

# `positive_data_acceptance` treats any non-2xx answer to schema-valid data as a
# finding, and a *documented* 422 is still a rejection to it. Two invariants on
# this payload cannot be pushed into the schema, so 422 is added to the expected
# set rather than the check being turned off:
#
#   - `ratingAverage: 0, ratingCount: null`. `dependentRequired` already forces
#     the pair to be present together, but the fields are nullable and the
#     handler reads an explicit `null` as "not supplied", so a present-but-null
#     count breaks the pair. JSON Schema has no way to say "both null or both
#     non-null" without an `if`/`then` pair that fights `additionalProperties`.
#     Whether `null` should instead mean "leave unchanged" here — as it already
#     does for the relation arrays on this same payload — is a real API question,
#     filed separately.
#   - `language`, which is validated as a BCP-47 tag by ICU at runtime.
#
# Known cost: a genuine over-rejection on this operation would now be reported
# only if it used a status other than 422.
[[operations]]
include-name = "PATCH /api/v1/courses/{id}"
parameters = { "path.id" = "seed-course-fundamentals" }
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

# Same treatment, different reason: the 422 here is raised by the scraped
# fragment stored on the task, not by anything in the request, so there is no
# request schema that could have prevented it. The Stateful phase reaches this
# operation now that a seeded course id lets it create an identify task first.
[[operations]]
include-name = "POST /api/v1/admin/identify-tasks/{id}/apply"
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

[[operations]]
include-name = "GET /api/v1/courses/{id}/outline"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
include-name = "GET /api/v1/courses/{id}/download-estimate"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
include-name = "POST /api/v1/courses/{id}/mark-complete"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
include-name = "POST /api/v1/courses/{id}/reset-progress"
parameters = { "path.id" = "seed-course-fundamentals" }

[[operations]]
include-name = "GET /api/v1/lessons/{id}"
parameters = { "path.id" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/lessons/{id}/stream-url"
parameters = { "path.id" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/lessons/{lessonId}/bookmarks"
parameters = { "path.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "POST /api/v1/lessons/{lessonId}/bookmarks"
parameters = { "path.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/lessons/{lessonId}/materials/{materialId}/download-url"
parameters = { "path.lessonId" = "seed-lesson-welcome", "path.materialId" = "seed-material-welcome-handout" }

# `PUT /notes` and `POST /progress` carry the lesson id in the BODY, not the
# path, which is why they showed up in the same `missing_test_data` list. The
# override syntax reaches into the body the same way.
#
# These are the only route to the two reads below: a note and a progress row are
# keyed on (userId, lessonId) and the principal is created at sign-up, so no
# seed can pre-create either — only a write during the run can. Both writes are
# declared ahead of their reads in the schema, and schemathesis walks operations
# in that order, so a read can find what a write left behind. It is not
# guaranteed and CI still reports both reads as 404-dominant; what the pinned
# lesson id does buy unconditionally is that they reach the handler at all,
# rather than being turned away at the authz check with a 403.
#
# The two reads therefore also carry the `ensure_resource_availability`
# exemption: `PUT /notes` creates a note and schemathesis links from it into
# `GET /notes/{lessonId}`, where a 404 means "no row for this principal yet",
# not "the API lost what it just created". Same shape as the `/libraries/{id}`
# family below.
#
# `negative_data_rejection` is also off on both, for the same structural
# reason `POST /realtime/token` disables it at the top of this file: the
# `body.lessonId` override above replaces whatever value the check generated
# — including a deliberately empty or missing `lessonId` meant to verify the
# API rejects it — with the pinned seed value before the request goes out.
# One CI run reported "API accepted schema-violating request" on `PUT /notes`
# ("Invalid component: in body - violates `required` (was "")"), but the
# request it actually printed as a repro carried `lessonId:
# "seed-lesson-welcome"`: fully valid. Schemathesis was still describing the
# mutation it had generated for `lessonId` before this file's override
# overwrote it — the check never got to exercise what it thought it was
# testing. `not_a_server_error` and every other check stay armed on both
# operations; only this one check, over this one field, is a false alarm.
[[operations]]
include-name = "PUT /api/v1/notes"
parameters = { "body.lessonId" = "seed-lesson-welcome" }
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "POST /api/v1/progress"
parameters = { "body.lessonId" = "seed-lesson-welcome" }
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "GET /api/v1/notes/{lessonId}"
parameters = { "path.lessonId" = "seed-lesson-welcome" }
checks.ensure_resource_availability.enabled = false

[[operations]]
include-name = "DELETE /api/v1/notes/{lessonId}"
parameters = { "path.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/progress/{lessonId}"
parameters = { "path.lessonId" = "seed-lesson-welcome" }
checks.ensure_resource_availability.enabled = false

# ---- the /libraries/{id} family --------------------------------------------
#
# `ensure_resource_availability` is disabled on every operation in this group,
# for one structural reason: `POST /api/v1/libraries` is the only create
# endpoint in the API whose id feeds a whole family of sub-resources, so
# schemathesis infers a link from it into each of them — and a parameter
# override wins over a link. The DELETE, the scans and the transcriptions all
# therefore address the seeded library rather than the one the scenario just
# created, and the check reports "the API returned 404 for a resource that was
# just created" whenever the pinned target legitimately has nothing to return:
# no transcription has ever been recorded (`POST` answers 503 without a whisper
# model), and `scans/latest` is empty until the first scan lands. Those 404s
# describe this configuration, not the API. Same reasoning as the
# `POST /realtime/token` block at the top of this file.
#
# It is switched off across the family rather than on the two operations that
# happened to trip it, because which ones trip depends on the order scenarios
# run in — a gate that fails on a coin flip is worse than one with a documented
# hole. Every other check stays armed on all of them.
#
# Known cost: a genuine "created library is not readable" bug would now be
# caught only by the read operations' own checks, not by this one.
#
# `negative_data_rejection` is off for the same root cause, on a different
# check: every operation here has `path.id` (or `path.id` = the scratch
# library on DELETE) as its only required parameter, and the override always
# wins — so when the negative generator's chosen mutation for a given case is
# to make that id invalid, the override quietly replaces it with a valid one
# before the request goes out, and what actually reaches the API is a fully
# valid, fully authenticated request that correctly answers 202/200. The check
# still reports "API accepted schema-violating request", describing the case
# it generated, not the one that was sent — same mechanism `PUT /notes` and
# `POST /progress` already document below for a `body.lessonId` override.
# `POST /api/v1/libraries/{id}/transcriptions` above carries the same
# exemption for the same reason; it lives in its own block because of its
# WHISPER_MODE story, not because the mechanism differs.
#
# First observed on `POST .../transcriptions`, whose optional body gives the
# generator a second thing to try beyond the path — the id-only operations
# below (`scans`, `scans/latest`, etc.) are exposed to the identical mechanism
# even though no CI run has hit it on them yet. Fixed across the family for
# the same coin-flip reason as `ensure_resource_availability` above, not
# preemptively: the override is what breaks the check, and every operation
# here carries that override.

[[operations]]
include-name = "GET /api/v1/libraries/{id}"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "PATCH /api/v1/libraries/{id}"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

# Pinned at something disposable, deliberately. This operation really deletes
# what it is pointed at and cascades — the repository's own comment lists the
# order: lessonProgress → bookmark → note → courseProgressReadModel →
# accessGrant → scan → course → library. Left unpinned, the Stateful phase
# chains a library id out of an earlier response straight into it and takes the
# entire seed with it, mid-run: one CI run had 33 operations back on 404 and 0
# of 265 stateful links covered, because the fixtures had been deleted by the
# suite that exists to exercise them. Pinning it at `seed-library-main` would do
# the same thing on purpose. Hence the second, empty library the seed creates
# for no other reason.
[[operations]]
include-name = "DELETE /api/v1/libraries/{id}"
parameters = { "path.id" = "seed-library-scratch" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

# `/data/courses` exists and is empty in the backend image, so a scan is a real
# 202 over an empty tree — and it gives `scans/latest` a row to return. Safe to
# point at the seeded library: a scan reconciles transcripts only and leaves
# course and lesson rows alone (see the orphan-cleanup block in
# run-scan.handler.ts), so it cannot erase what the other overrides address.
[[operations]]
include-name = "POST /api/v1/libraries/{id}/scans"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "GET /api/v1/libraries/{id}/scans/latest"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "GET /api/v1/libraries/{id}/transcriptions"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "GET /api/v1/libraries/{id}/transcriptions/latest"
parameters = { "path.id" = "seed-library-main" }
checks.ensure_resource_availability.enabled = false
checks.negative_data_rejection.enabled = false

[[operations]]
include-name = "GET /api/v1/catalog/instructors/{slug}"
parameters = { "path.slug" = "seed-instructor-ada-lovelace" }

[[operations]]
include-name = "GET /api/v1/catalog/studios/{slug}"
parameters = { "path.slug" = "seed-studio-analytical-engine" }

[[operations]]
include-name = "GET /api/v1/catalog/tags/{slug}"
parameters = { "path.slug" = "seed-tag-fundamentals" }

# ---------------------------------------------------------------------------
# Admin upserts: a rejected slug is a 422, and that is the contract
# ---------------------------------------------------------------------------
#
# With the slug `pattern` off the wire (see the two slug schemas in
# openapi.yaml), the generator can finally build values for these bodies — and
# it builds invalid slugs, which is exactly what it should do. The API answers
# 422 `entity-slug-invalid` from the `EntitySlug` value object, and
# `positive_data_acceptance` counts any non-2xx answer to schema-valid data as a
# finding: schema-valid is no longer the same as domain-valid for this field.
#
# 422 is therefore added to the expected set rather than the check being turned
# off, the same treatment `PATCH /api/v1/courses/{id}` already carries above for
# invariants JSON Schema cannot express.
#
# Applied to all three admin upserts, not only the one a run happened to trip:
# they share the field and the value object, and which of them a stateful
# scenario reaches depends on the seed. A gate that fails on a coin flip is
# worse than one with a documented hole — the same reasoning this file applies
# to the `/libraries/{id}` family.

[[operations]]
include-name = "POST /api/v1/admin/instructors"
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

[[operations]]
include-name = "POST /api/v1/admin/studios"
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

[[operations]]
include-name = "POST /api/v1/admin/tags"
checks.positive_data_acceptance.expected-statuses = ["2xx", 401, 403, 404, 409, 422, "5xx"]

# ---------------------------------------------------------------------------
# `offset`/`limit` query parameters: the negation has no wire-level type to
# violate
# ---------------------------------------------------------------------------
#
# `negative_data_rejection` mutates the JSON-level type of `offset`/`limit`
# from `integer` to something else — but a query string carries no types.
# When the generator's chosen replacement is a digit string (Hypothesis
# reaches for `"0"`/`"1"` often; that is what happened here), it serialises
# byte-identical to a valid request: `offset=1` on the wire either way.
# `express-openapi-validator` coerces it back to a number and answers 200,
# which is the correct, required behaviour for a query parameter — the check
# then reports the case it *generated* (a JSON string) instead of the one it
# *sent* (indistinguishable from valid). Confirmed directly: a hand-built
# request with `offset=1` gets 200 against a live stack; nothing here is
# hypothetical.
#
# Whether a given CI run is green depends on whether the generator's mutation
# for a given case happens to look like a bare non-negative integer or not —
# same false-positive shape `POST /realtime/token`, `PUT /notes` and the
# `/libraries/{id}` family above already carry this exemption for, each for
# its own reason. First observed on `GET /catalog/tags` (issue #528, PR #526's
# CI run), but the parameter, not the operation, is at fault: eleven
# operations declare `offset` and/or `limit` as `type: integer` in query, and
# every one of them is exposed to the identical mechanism. Fixed across all
# eleven for the same coin-flip reason the rest of this file gives — a gate
# that fails on a seed is worse than one with a documented hole.
#
# Two fixes were weighed, not guessed — both required a live stack to judge:
#
#   1. This one: disable `negative_data_rejection` where the negation is
#      unsound. Only that one check drops on these operations; every other
#      check (`not_a_server_error`, `positive_data_acceptance`,
#      `response_schema_conformance`, …) stays fully armed.
#   2. Stop declaring `offset`/`limit` as `type: integer` on the wire (string
#      + `pattern`), so the negation becomes expressible again. Rejected: the
#      type is duplicated inline 14 times across these eleven operations
#      (no shared `$ref` to retype in one place), retyping it changes what
#      every generated client emits and what the handler reads off
#      `req.query` today, and it is therefore a wire-breaking change under
#      this repo's own versioning rule — a new `/api/v2` prefix and an ADR to
#      fix a gate false-positive is disproportionate, and reaches well past
#      what a spec-only change can carry alone.
#
# Known cost: a genuine "the API accepted an out-of-range offset/limit" bug on
# any of these eleven operations would now be caught only by
# `positive_data_acceptance` / `response_schema_conformance` on a
# schema-compliant value, not by this check deliberately sending a
# non-compliant one.
[[operations]]
include-operation-id = [
  "getContinueWatching",
  "getRecentlyAdded",
  "getRecentlyCompleted",
  "listAdminScans",
  "listAdminTranscriptions",
  "listAdminUsers",
  "listInstructors",
  "listLibraryTranscriptions",
  "listStudios",
  "listTags",
  "searchCatalogue",
]
checks.negative_data_rejection.enabled = false
