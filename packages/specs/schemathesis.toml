# `PUT /notes` and `POST /progress` carry the lesson id in the BODY, not the
# path, which is why they showed up in the same `missing_test_data` list. The
# override syntax reaches into the body the same way.
#
# They are also what makes the two reads below reachable: the note and the
# progress row are keyed on (userId, lessonId) and the principal is created at
# runtime, so no seed can pre-create them — but a write earlier in the run can.
# Schemathesis walks operations in schema order and both writes are declared
# ahead of their reads, so the reads usually find a row; when they do not, they
# now get a real 404 from the handler instead of a 403 from the authz check.
[[operations]]
include-name = "PUT /api/v1/notes"
parameters = { "body.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "POST /api/v1/progress"
parameters = { "body.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/notes/{lessonId}"
parameters = { "path.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "DELETE /api/v1/notes/{lessonId}"
parameters = { "path.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/progress/{lessonId}"
parameters = { "path.lessonId" = "seed-lesson-welcome" }

[[operations]]
include-name = "GET /api/v1/libraries/{id}"
parameters = { "path.id" = "seed-library-main" }

[[operations]]
include-name = "PATCH /api/v1/libraries/{id}"
parameters = { "path.id" = "seed-library-main" }

# `DELETE /api/v1/libraries/{id}` is deliberately NOT pinned, and the seed no
# longer carries a sacrificial library for it. An override wins over a stateful
# link, so pinning the id broke the one mechanism that already covered this
# operation properly: the Stateful phase creates a library through
# `POST /api/v1/libraries` and follows the inferred link to delete it. With the
# override in place that DELETE went to the seeded library instead, which the
# previous scenario had already removed, and `ensure_resource_availability`
# correctly reported "the API returned 404 for a resource that was just
# created". Deletes belong to the Stateful phase; leave them there.

# `/data/courses` exists and is empty in the backend image, so a scan is a real
# 202 over an empty tree — and it gives `scans/latest` a row to return.
[[operations]]
include-name = "POST /api/v1/libraries/{id}/scans"
parameters = { "path.id" = "seed-library-main" }

[[operations]]
include-name = "GET /api/v1/libraries/{id}/scans/latest"
parameters = { "path.id" = "seed-library-main" }

[[operations]]
include-name = "GET /api/v1/libraries/{id}/transcriptions"
parameters = { "path.id" = "seed-library-main" }

[[operations]]
include-name = "GET /api/v1/libraries/{id}/transcriptions/latest"
parameters = { "path.id" = "seed-library-main" }

[[operations]]
include-name = "GET /api/v1/catalog/instructors/{slug}"
parameters = { "path.slug" = "seed-instructor-ada-lovelace" }

[[operations]]
include-name = "GET /api/v1/catalog/studios/{slug}"
